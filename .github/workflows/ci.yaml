
# Guidelines for runner

name: CI

on: 
  push:
    branches:
      -master 
  pull_request:    

jobs:
  linting:
    runs-on: ubuntu-latest

    strategy:
      os: [ubuntu-latest, windows-latest, macos-latest]
      version: ['3.9', '3.10'] 

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 app.py
